name: Build Medialab Shutdown Timer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows EXE and MSI
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Find project ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Filter "Medialab-Shutdown-Timer-Fixed-Project.zip" -File -Recurse |
            Select-Object -First 1
          if (-not $zip) {
            Write-Host "ZIP files found:" -ForegroundColor Yellow
            Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Filter "*.zip" -File -Recurse | ForEach-Object { Write-Host $_.FullName }
            throw "Upload Medialab-Shutdown-Timer-Fixed-Project.zip to the repository root."
          }
          "PROJECT_ZIP=$($zip.FullName)" >> $env:GITHUB_ENV
          Write-Host "Using project ZIP: $($zip.FullName)" -ForegroundColor Green

      - name: Extract project
        shell: pwsh
        run: |
          $projectPath = "$env:GITHUB_WORKSPACE/app"
          if (Test-Path $projectPath) { Remove-Item $projectPath -Recurse -Force }
          New-Item -ItemType Directory -Path $projectPath -Force | Out-Null
          Expand-Archive -Path "$env:PROJECT_ZIP" -DestinationPath $projectPath -Force

      - name: Verify required files
        shell: pwsh
        working-directory: app
        run: |
          $required = @(
            "package.json", "src/App.tsx", "src/utils/native.ts",
            "src-tauri/Cargo.toml", "src-tauri/build.rs",
            "src-tauri/src/lib.rs", "src-tauri/src/main.rs",
            "src-tauri/tauri.conf.json", "src-tauri/icons/icon.ico"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing required file: $file" }
            Write-Host "[OK] $file" -ForegroundColor Green
          }

      - name: Install dependencies
        shell: pwsh
        working-directory: app
        run: npm install --legacy-peer-deps

      - name: Build frontend
        shell: pwsh
        working-directory: app
        run: npm run build

      - name: Build Windows installers
        shell: pwsh
        working-directory: app
        run: npx tauri build --bundles nsis,msi

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Medialab-Shutdown-Timer-Windows
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30
